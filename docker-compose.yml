services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_app -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
