name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: school_admission
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_admission"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMISSION_TEST_CONNECTION: Host=localhost;Port=5432;Database=school_admission;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/SchoolAdmission.Api.Tests/SchoolAdmission.Api.Tests.csproj --configuration Release
      - run: dotnet build backend/SchoolAdmission.Api/SchoolAdmission.Api.csproj --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
